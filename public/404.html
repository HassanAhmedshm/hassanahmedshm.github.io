    <style>
      html, body { margin: 0; padding: 0; background: #88b763; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "JetBrains Mono", monospace;
        color: #fff8dd;
      }
      .loader {
        padding: 1.5rem 2rem;
        background: rgba(26, 18, 12, 0.92);
        border: 3px solid #2a2013;
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .loader p { margin: 0; }
      .loader .small {
        margin-top: 0.5rem;
        font-size: 0.75rem;

      }
    </style>
  </head>
  <body>
    <main class="loader">
      <p>Loading…</p>
      <p class="small">Spawning you back home</p>
    </main>

    <!--
      GitHub Pages fallback trick.

      This 404.html is served by GH Pages for any path it can't resolve.
      We forward the user's requested path into the SPA's hash router so the
      React app can take over from there:

        /random-path           → /#<random-path>   → React Router * → NotFound
        /astrov                → /#/astrov          → React Router    → AstroV
        /                      (404 doesn't fire)

      Doing the redirect here means typing a direct URL still ends up at the
      same dynamic NotFound the in-app experience uses. The href below is the
      no-JS fallback; the <script> updates it with the correct hash path on
      load so the user lands on the right page even when typed literally.
    -->
    <script>
      (function () {
        // Strip trailing slashes so /foo/ becomes /foo.
        var rawPath = location.pathname.replace(/\/+$/, "") || "/";
        // HashRouter treats "/#/x" as the route "/x".
        var target = location.origin + "/#" + rawPath + location.search + location.hash;

        // Replace (not push) so the user's browser back-button isn't polluted
        // with the 404 detour.
        window.location.replace(target);

        // Belt-and-suspenders — if for some reason location.replace is
        // ignored, the meta refresh already pointed at "/" which will at
        // least land them on the home page.
      })();
    </script>
  </body>
