<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Redirect only client-side routes, not static assets.
      var path = location.pathname;
      var looksLikeAsset = /\.[^/]+$/.test(path);

      if (!looksLikeAsset) {
        sessionStorage.setItem('redirect', path + location.search + location.hash);
        location.replace(location.origin + path.split('/').slice(0, -1).join('/') + '/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
